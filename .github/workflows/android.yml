name: Android

on:
  push:
    branches: [main]
    paths-ignore:
      - "mcp-server/**"
      - "**.md"
      - ".github/workflows/mcp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "KankaForAndroid-v1.0.${{ github.run_number }}.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kanka for Android v1.0.${{ github.run_number }}
          files: KankaForAndroid-v1.0.${{ github.run_number }}.apk
          make_latest: true
